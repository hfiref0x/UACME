name: Build UACME

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:
    inputs:
      version_ref:
        description: '要构建的分支、Tag 或 Commit（留空默认构建当前分支，例如：3.6.x_plus 或 3.6.4）'
        required: false
        default: '3.6.x_plus'

env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Parse Version Name
      id: parse_version
      shell: pwsh
      run: |
        $inputRef = "${{ inputs.version_ref }}"
        if ([string]::IsNullOrWhiteSpace($inputRef)) {
          $ver = "${{ github.ref_name }}"
        } else {
          $ver = $inputRef
        }
        # 过滤文件名不合法的字符
        $cleanVer = $ver -replace '[\\/:*?"<>|]', '-'
        Write-Output "VER_TAG=$cleanVer" >> $env:GITHUB_ENV
        Write-Output "VER_REF=$ver" >> $env:GITHUB_ENV

    - name: Checkout Code
      uses: actions/checkout@v4.2.2
      with:
        ref: ${{ env.VER_REF }}

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build x64 Release
      run: |
        msbuild Source\uacme.sln /m /v:minimal /p:Configuration=Release /p:Platform=x64

    - name: Upload Compiled Artifacts
      uses: actions/upload-artifact@v4.4.3
      with:
        name: UACME-x64-${{ env.VER_TAG }}
        path: |
          Source/bin/**
          Source/**/Release/*.exe
          Source/**/Release/*.dll
        if-no-files-found: warn
